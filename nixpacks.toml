[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.pip", "python312Packages.setuptools"]

[phases.install]
cmds = [
  "npm install",
  "cd python_sim && pip install --user -r requirements.txt && cd .."
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "chmod +x start.sh && ./start.sh"

