name: Schema & Codegen Drift Check

on: [push, pull_request]

jobs:
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Install Python codegen tool
        run: pip install datamodel-code-generator
      - name: Run codegen
        run: |
          npm run codegen:ts
          npm run codegen:zod
          npm run codegen:py
      - name: Check for drift
        run: git diff --exit-code || (echo 'Codegen drift detected! Run codegen and commit.' && exit 1) 

  python-export-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python simulation dependencies
        run: python -m pip install --upgrade pip && pip install -r python_sim/requirements.txt
      - name: Run notebook export regression tests
        run: python -m unittest python_sim/test_export_notebook.py