[tool.poetry]
name = "mettamodeler-python"
version = "0.1.0"
description = "Python simulation service for MettaModeler"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
flask = "2.3.3"
werkzeug = "3.0.1"
flask-cors = "4.0.0"
pydantic = "2.6.1"
networkx = "3.2.1"
numpy = "2.2.0"
pandas = "2.2.1"
nbformat = "5.10.4"
scipy = "1.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 